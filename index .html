<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>GUY1X คอฟฟี่ - หน้าหลัก</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: "Tahoma", sans-serif;
    background-color: #fdf8f2;
    color: #3b2417;
  }

  /* ส่วนหัวเว็บ */
  header {
    background-color: #3b2417;
    color: white;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 60px;
  }

  header .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: bold;
    color: #e8b23d;
  }

  header .logo img {
    height: 40px;
    border-radius: 6px;
  }

  header nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 16px;
  }

  header nav a:hover {
    color: #e8b23d;
  }

  header nav a.active {
    color: #e8b23d;
    font-weight: bold;
  }

  /* แกลเลอรีรูปเลื่อนดู เต็มหน้าจอ */
  .gallery {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    height: calc(100vh - 60px);
    scroll-snap-type: x mandatory;
  }

  .gallery-item {
    flex: 0 0 100%;
    height: 100%;
    background-color: #a9744f;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    scroll-snap-align: start;
  }
.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
  .gallery::-webkit-scrollbar {
    height: 10px;
  }

  .gallery::-webkit-scrollbar-thumb {
    background-color: #e8b23d;
    border-radius: 10px;
  }
</style>
</head>
<body>

  <!-- ส่วนหัวเว็บ -->
  <header>

    <nav>
      <a href="index .html">หน้าหลัก</a>
      <a href="menu.html">เมนู</a>
      <a href="promotion.html">โปรโมชัน</a>
      <a href="about.html">เกี่ยวกับเรา</a>
    </nav>
  </header>


  <div class="gallery">
    <div class="gallery-item" style="background-color:#a9744f;"><img src="/img/4ywv7zz8en7v.webp" alt=""></div>
    <div class="gallery-item" style="background-color:#6b4226;"><img src="/img/Sayhay_50-1.jpg" alt=""></div>
    <div class="gallery-item" style="background-color:#8a5a3b;"><img src="/img/ArticlePic_1670x1095_Artboard-1-05-5-1024x672.jpg" alt=""></div>
    <div class="gallery-item" style="background-color:#5c3a24;"><img src="/img/cafes-in-khonkaen.webp" alt=""></div>
    <div class="gallery-item" style="background-color:#b98552;"><img src="/img/cafes-in-lamphun.webp" alt=""></div>
  </div>

</body>
</html>
